spring.application.name=One-Stop-Career-Advisor-Platform-Test

spring.datasource.url=jdbc:h2:mem:career_advisor_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable automatic CommandLineRunner seeding during unit/integration tests to keep tests completely isolated
app.seed.data=false
